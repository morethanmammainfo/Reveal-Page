<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Season — The First 6 Weeks</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;600&family=Lora:wght@500;600&display=swap" rel="stylesheet">

<style>
:root {
  --sand: #F2EBE1;
  --sand-deep: #E8DFD0;
  --clay: #8B5E4A;
  --sage: #8B9A7C;
  --sage-deep: #6E7D60;
  --ink: #2B2620;
  --rose: #C98B7A;
  --line: rgba(43, 38, 32, 0.12);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--sand);
  color: var(--ink);
  font-family: "Karla", sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  line-height: 1.5;
}

.page {
  width: 100%;
  max-width: 520px;
}

.card {
  width: 100%;
  background: #FFFEFB;
  border: 1px solid var(--line);
  border-radius: 4px;
  box-shadow:
    0 1px 2px rgba(43,38,32,0.06),
    0 12px 40px rgba(43,38,32,0.08);
  overflow: hidden;
}

.card-inner {
  padding: 40px 32px;
}

.eyebrow {
  margin-bottom: 8px;
  color: var(--sage-deep);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

h1 {
  margin: 0 0 8px;
  font-family: "Lora", serif;
  font-size: 27px;
  font-weight: 600;
  line-height: 1.28;
}

.sub {
  margin: 0 0 30px;
  color: rgba(43,38,32,0.65);
  font-size: 14.5px;
}

.screen {
  display: none;
}

.screen.active {
  display: block;
  animation: fadeUp 0.3s ease both;
}

@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(6px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.begin-btn {
  display: inline-block;
  padding: 14px 20px;
  border: 1px solid var(--sage);
  border-radius: 3px;
  background: var(--sand);
  color: var(--ink);
  font-family: "Karla", sans-serif;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
}

.begin-btn:hover {
  background: #EEF0E8;
}

.progress-track {
  width: 100%;
  height: 3px;
  margin-bottom: 28px;
  overflow: hidden;
  border-radius: 2px;
  background: var(--line);
}

.progress-fill {
  width: 0;
  height: 100%;
  background: var(--sage);
  transition: width 0.3s ease;
}

.q-count {
  margin-bottom: 10px;
  color: rgba(43,38,32,0.5);
  font-size: 12px;
}

.q-text {
  margin: 0 0 20px;
  font-family: "Lora", serif;
  font-size: 19px;
  font-weight: 500;
  line-height: 1.4;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.opt {
  width: 100%;
  padding: 14px 16px;
  border: 1px solid var(--line);
  border-radius: 3px;
  background: var(--sand);
  color: var(--ink);
  font-family: "Karla", sans-serif;
  font-size: 15px;
  line-height: 1.4;
  text-align: left;
  cursor: pointer;
  transition: 0.15s ease;
}

.opt:hover {
  border-color: var(--sage);
  background: #EEF0E8;
}

.opt:active {
  transform: scale(0.995);
}

.result {
  text-align: center;
}

.season-mark {
  width: 56px;
  height: 56px;
  margin: 0 auto 20px;
  border-radius: 50%;
  background: var(--sand-deep);
  display: flex;
  align-items: center;
  justify-content: center;
}

.season-mark svg {
  width: 26px;
  height: 26px;
}

.result .eyebrow,
.result h1 {
  text-align: center;
}

.result h1 {
  font-size: 28px;
}

.result-body {
  margin: 18px 0 28px;
  color: rgba(43,38,32,0.78);
  font-size: 15.5px;
  text-align: left;
}

.result-body p {
  margin: 0 0 14px;
}

.gentle-note {
  margin-bottom: 28px;
  padding: 12px 16px;
  border-left: 2px solid var(--rose);
  border-radius: 0 3px 3px 0;
  background: var(--sand);
  color: rgba(43,38,32,0.58);
  font-size: 13px;
  text-align: left;
}

.restart {
  padding: 0 0 2px;
  border: 0;
  border-bottom: 1px solid transparent;
  background: none;
  color: var(--sage-deep);
  font-family: "Karla", sans-serif;
  font-size: 13px;
  cursor: pointer;
}

.restart:hover {
  border-bottom-color: var(--sage-deep);
}

footer {
  margin-top: 22px;
  color: rgba(43,38,32,0.42);
  font-size: 11.5px;
  text-align: center;
}

@media (min-width: 560px) {
  .card-inner {
    padding: 56px 48px;
  }
}

@media (max-width: 420px) {
  body {
    padding: 18px;
    align-items: flex-start;
    padding-top: 42px;
  }

  .card-inner {
    padding: 34px 25px;
  }

  h1 {
    font-size: 25px;
  }
}
</style>
</head>

<body>

<div class="page">

  <div class="card">
    <div class="card-inner">

      <!-- INTRO -->
      <section id="intro" class="screen active">
        <div class="eyebrow">The First 6 Weeks</div>

        <h1>Where are you, right now?</h1>

        <p class="sub">
          Five quick questions. No right answers — just a moment to
          check in with yourself before you close this tab.
        </p>

        <button id="beginButton" class="begin-btn" type="button">
          Begin →
        </button>
      </section>


      <!-- QUIZ -->
      <section id="quiz" class="screen">

        <div class="progress-track">
          <div id="progressFill" class="progress-fill"></div>
        </div>

        <div id="questionContainer"></div>

      </section>


      <!-- RESULT -->
      <section id="result" class="screen result">

        <div id="seasonIcon" class="season-mark"></div>

        <div class="eyebrow">Your season is</div>

        <h1 id="seasonTitle"></h1>

        <div id="seasonBody" class="result-body"></div>

        <div id="gentleNote" class="gentle-note"></div>

        <button id="restartButton" class="restart" type="button">
          ↺ Take it again another day
        </button>

      </section>

    </div>
  </div>

  <footer>
    This is a gentle reflection, not a medical or psychological assessment.
  </footer>

</div>


<script>

const questions = [
  {
    text: "How does your body feel most days right now?",
    options: [
      ["Tender, and I'm still moving carefully", "rebuilding"],
      ["Better than last week, but not quite mine yet", "softening"],
      ["Mostly steady, with occasional tired days", "steadying"],
      ["Genuinely strong again", "rising"]
    ]
  },

  {
    text: "When you think about your emotions lately, what's true?",
    options: [
      ["They come in waves I don't always see coming", "rebuilding"],
      ["I'm finding moments of calm between the hard ones", "softening"],
      ["I feel mostly like myself, with good and hard days", "steadying"],
      ["I feel settled and clear most of the time", "rising"]
    ]
  },

  {
    text: "How's sleep treating you?",
    options: [
      ["Fragmented — I'm running on very little", "rebuilding"],
      ["Improving, but still unpredictable", "softening"],
      ["Decent stretches most nights now", "steadying"],
      ["I'm finally getting real rest", "rising"]
    ]
  },

  {
    text: "What do you need most this week?",
    options: [
      ["Permission to slow down further", "rebuilding"],
      ["A little more support so I can breathe", "softening"],
      ["To trust that I'm doing okay", "steadying"],
      ["Something for myself, beyond just surviving", "rising"]
    ]
  },

  {
    text: "If today had a color, what would it be?",
    options: [
      ["A quiet, muted grey", "rebuilding"],
      ["A soft, warming rose", "softening"],
      ["A steady, grounded green", "steadying"],
      ["A bright, open gold", "rising"]
    ]
  }
];


const seasons = {

  rebuilding: {
    title: "The Rebuilding Season",

    icon: `
      <svg viewBox="0 0 24 24"
      fill="none"
      stroke="#8B5E4A"
      stroke-width="1.6">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 3v3M12 18v3M3 12h3M18 12h3
        M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1
        M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>
      </svg>
    `,

    body: `
      <p>
        You're in the part no one takes photos of — the quiet,
        unglamorous work of putting yourself back together,
        one day at a time.
      </p>

      <p>
        This isn't a setback. It's the actual work.
        Slow is allowed here.
      </p>
    `,

    note:
      "If most days feel heavy, not just tired, please talk to your doctor. You deserve support, not just tracking."
  },


  softening: {
    title: "The Softening Season",

    icon: `
      <svg viewBox="0 0 24 24"
      fill="none"
      stroke="#C98B7A"
      stroke-width="1.6">
        <path d="M12 21C8 18 5 14.5 5 11
        a5 5 0 0 1 9-3
        a5 5 0 0 1 5 3
        c0 3.5-3 7-7 10z"/>
      </svg>
    `,

    body: `
      <p>
        Something is easing. You're not fully through it,
        but you can feel the ground again on some days —
        and that matters.
      </p>

      <p>
        Keep going gently. You don't have to rush
        the rest of the way.
      </p>
    `,

    note:
      "If most days feel heavy, not just tired, please talk to your doctor. You deserve support, not just tracking."
  },


  steadying: {
    title: "The Steadying Season",

    icon: `
      <svg viewBox="0 0 24 24"
      fill="none"
      stroke="#6E7D60"
      stroke-width="1.6">
        <path d="M4 15l4-4 4 3 4-6 4 4"/>
      </svg>
    `,

    body: `
      <p>
        You're finding your footing. Most days feel like yours
        again, even with the hard ones mixed in.
      </p>

      <p>
        This is real progress — let yourself notice it.
      </p>
    `,

    note:
      "If most days feel heavy, not just tired, please talk to your doctor. You deserve support, not just tracking."
  },


  rising: {
    title: "The Rising Season",

    icon: `
      <svg viewBox="0 0 24 24"
      fill="none"
      stroke="#8B9A7C"
      stroke-width="1.6">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v3M12 19v3M2 12h3M19 12h3
        M4.9 4.9L7 7M17 17l2.1 2.1
        M4.9 19.1L7 17M17 7l2.1-2.1"/>
      </svg>
    `,

    body: `
      <p>
        You've come through something enormous, and it shows.
        There's energy here, and clarity, and something that
        looks a lot like yourself again.
      </p>

      <p>
        However you got here — it counts.
      </p>
    `,

    note:
      "Feeling strong doesn't mean you have to do everything at once. Keep protecting your rest."
  }

};


let currentQuestion = 0;

let scores = {
  rebuilding: 0,
  softening: 0,
  steadying: 0,
  rising: 0
};


const intro = document.getElementById("intro");
const quiz = document.getElementById("quiz");
const result = document.getElementById("result");

const beginButton = document.getElementById("beginButton");
const restartButton = document.getElementById("restartButton");

const questionContainer =
  document.getElementById("questionContainer");

const progressFill =
  document.getElementById("progressFill");


function showScreen(screen) {
  intro.classList.remove("active");
  quiz.classList.remove("active");
  result.classList.remove("active");

  screen.classList.add("active");
}


function startQuiz() {
  currentQuestion = 0;

  scores = {
    rebuilding: 0,
    softening: 0,
    steadying: 0,
    rising: 0
  };

  showScreen(quiz);
  renderQuestion();
}


function renderQuestion() {

  const question = questions[currentQuestion];

  progressFill.style.width =
    ((currentQuestion / questions.length) * 100) + "%";

  questionContainer.innerHTML = "";

  const count = document.createElement("div");
  count.className = "q-count";
  count.textContent =
    "Question " +
    (currentQuestion + 1) +
    " of " +
    questions.length;


  const title = document.createElement("div");
  title.className = "q-text";
  title.textContent = question.text;


  const options = document.createElement("div");
  options.className = "options";


  question.options.forEach(function(option) {

    const button = document.createElement("button");

    button.type = "button";
    button.className = "opt";
    button.textContent = option[0];

    button.addEventListener("click", function() {
      answerQuestion(option[1]);
    });

    options.appendChild(button);
  });


  questionContainer.appendChild(count);
  questionContainer.appendChild(title);
  questionContainer.appendChild(options);
}


function answerQuestion(season) {

  scores[season] += 2;
  currentQuestion += 1;

  if (currentQuestion < questions.length) {
    renderQuestion();
  } else {
    progressFill.style.width = "100%";

    setTimeout(function() {
      showResult();
    }, 250);
  }
}


function showResult() {

  let winningSeason = "rebuilding";
  let highestScore = -1;

  Object.keys(scores).forEach(function(season) {

    if (scores[season] > highestScore) {
      highestScore = scores[season];
      winningSeason = season;
    }

  });


  const season = seasons[winningSeason];

  document.getElementById("seasonIcon").innerHTML =
    season.icon;

  document.getElementById("seasonTitle").textContent =
    season.title;

  document.getElementById("seasonBody").innerHTML =
    season.body;

  document.getElementById("gentleNote").textContent =
    season.note;

  showScreen(result);
}


function restartQuiz() {
  showScreen(intro);
}


beginButton.addEventListener("click", startQuiz);
restartButton.addEventListener("click", restartQuiz);

</script>

</body>
</html>
